#:schema https://dystroy.org/bacon/.bacon.schema.json

# This is a configuration file for the bacon tool
#
# Complete help on configuration: https://dystroy.org/bacon/config/
#
# You may check the current default at
#   https://github.com/Canop/bacon/blob/main/defaults/default-bacon.toml

default_job = "test"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--package", "web", "--features", "web"]
need_stdout = false

[jobs.clippy-pedantic]
command = [
    "cargo", "clippy", "--package", "web", "--features", "web",
    "--", "-W", "clippy::pedantic",
]
need_stdout = false

[jobs.nextest]
command = [
    "sh", "-c",
    "cargo llvm-cov nextest -p app -p ui -p vault -p index --hide-progress-bar --failure-output final | awk '/^Filename/{printf \"%-40s %9s %8s %13s %9s\\n\",\"File\",\"MissLine\",\"Line%\",\"MissBranch\",\"Branch%\"; printf \"%s\\n\",\"----------------------------------------\"; next} /^-/{next} NF==13{printf \"%-40s %9s %8s %13s %9s\\n\",$1,$9,$10,$12,$13; next} {print}'"
]
need_stdout = true
analyzer = "nextest"

[jobs.nextest-cov]
command = [
    "sh", "-c",
    "out=$(cargo llvm-cov nextest -p app -p ui -p vault -p index --hide-progress-bar --failure-output final 2>&1); s=$?; printf '%s\\n' \"$out\" | awk -v failed=$s '/^Filename/{printf \"%-40s %9s %8s %13s %9s\\n\",\"File\",\"MissLine\",\"Line%\",\"MissBranch\",\"Branch%\"; printf \"%-40s\\n\",\"----------------------------------------\"; next} /^-+$/{next} NF==13{printf \"%-40s %9s %8s %13s %9s\\n\",$1,$9,$10,$12,$13; next} failed{print}'"
]
need_stdout = true
analyzer = "nextest"

# Playwright end-to-end suite (web target). Starts its own `dx run` server, so it
# is heavy (~15s warm, 1–2 min cold) — keep it a manual, on-demand job rather than
# part of the keystroke-fast Rust loop. Note: E2E drives the compiled wasm app in
# a browser, so it can NOT contribute to `cargo llvm-cov` coverage — that is why
# it is a separate job and not part of `nextest-cov`.
[jobs.e2e]
command = ["sh", "-c", "cd e2e && npm test"]
need_stdout = true

# Everything: Rust tests (with coverage table) then the E2E suite.
[jobs.test-all]
command = [
    "sh", "-c",
    "cargo llvm-cov nextest -p app -p ui -p vault -p index --hide-progress-bar --failure-output final && (cd e2e && npm test)"
]
need_stdout = true

[keybindings]
c = "job:clippy"
p = "job:clippy-pedantic"
t = "job:nextest"
v = "job:nextest-cov"
e = "job:e2e"
a = "job:test-all"
