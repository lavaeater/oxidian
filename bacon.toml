#:schema https://dystroy.org/bacon/.bacon.schema.json

# This is a configuration file for the bacon tool
#
# Complete help on configuration: https://dystroy.org/bacon/config/
#
# You may check the current default at
#   https://github.com/Canop/bacon/blob/main/defaults/default-bacon.toml

default_job = "test"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.clippy-client]
command = ["cargo", "clippy", "--package", "web", "--features", "web"]
need_stdout = false

[jobs.nextest]
command = [
    "sh", "-c",
    "cargo llvm-cov nextest --hide-progress-bar --failure-output final | awk '/^Filename/{printf \"%-40s %9s %8s %13s %9s\\n\",\"File\",\"MissLine\",\"Line%\",\"MissBranch\",\"Branch%\"; printf \"%s\\n\",\"----------------------------------------\"; next} /^-/{next} NF==13{printf \"%-40s %9s %8s %13s %9s\\n\",$1,$9,$10,$12,$13; next} {print}'"
]
need_stdout = true
analyzer = "nextest"

[jobs.nextest-cov]
command = [
    "sh", "-c",
    "out=$(cargo llvm-cov nextest --hide-progress-bar --failure-output final 2>&1); s=$?; printf '%s\\n' \"$out\" | awk -v failed=$s '/^Filename/{printf \"%-40s %9s %8s %13s %9s\\n\",\"File\",\"MissLine\",\"Line%\",\"MissBranch\",\"Branch%\"; printf \"%-40s\\n\",\"----------------------------------------\"; next} /^-+$/{next} NF==13{printf \"%-40s %9s %8s %13s %9s\\n\",$1,$9,$10,$12,$13; next} failed{print}'"
]
need_stdout = true
analyzer = "nextest"

[keybindings]
s = "job:clippy-server"
c = "job:clippy-client"
t = "job:nextest"
v = "job:nextest-cov"
