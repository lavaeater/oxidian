[package]
name = "vault"
version.workspace = true
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23.0"

# reqwest: on WASM the browser handles TLS; on native we need rustls — never
# native-tls/OpenSSL, which crashes Android at launch (no libssl.so). In 0.13 the
# feature is called `rustls` (0.12's `rustls-tls`), and `.form()` moved behind the
# `form` feature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }

# Android verifies certificates against these compiled-in Mozilla roots instead
# of reqwest's default `rustls-platform-verifier`, which panics on first use
# unless a Kotlin component is added to the Gradle build. See `src/http.rs`.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form"] }

[lints]
workspace = true
