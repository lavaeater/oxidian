[package]
name = "ui"
version.workspace = true
edition = "2024"

[dependencies]
dioxus = { workspace = true }
dioxus-use-js = { workspace = true }
dioxus-primitives = { workspace = true }
time = { workspace = true }
log = { workspace = true }
# Pure, no Dioxus dependency — `index::tasks::Status` is the one definition of
# a task signifier, and the editor renders exactly what the index parses.
index = { workspace = true }

[dev-dependencies]
# Render components to a string on the native target for tests. No SSR ships in
# production — this is purely a test driver.
dioxus-ssr = "0.8.0-alpha.1"


[lints]
workspace = true
