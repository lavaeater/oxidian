[package]
name = "index"
version.workspace = true
edition = "2024"

# The shared vault index: pure parsing and diffing over note content, with no
# I/O, no Dioxus, and no platform assumptions. Callers (`app`) do the fetching
# and the persisting; see docs/dataview.md §4.
[dependencies]
vault = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
