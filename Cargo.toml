[workspace]
resolver = "2"
members = [
    "packages/ui",
    "packages/vault",
    "packages/index",
    "packages/app",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
]
exclude = ["dioxus-use-js"]

[workspace.package]
version = "0.1.4"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
dioxus = { version = "0.8.0-alpha.1" }
lucide-dioxus = { version="3.11.0", features=["all-icons"] }
dioxus-use-js = { git ="https://github.com/lavaeater/dioxus-use-js.git", branch="dioxus-v0.8.0" }
# Our fork's `0.8` branch, pinned to the same dioxus 0.8.0-alpha.1 as the rest
# of the workspace. Only the calendar grid is used (see `ui::TaskDatePicker`);
# `router` is disabled since nothing here needs it.
dioxus-primitives = { git = "https://github.com/lavaeater/dioxus-components.git", branch = "0.8", default-features = false, features = ["web"] }
time = { version = "0.3", default-features = false }
log = "0.4"
# workspace
ui = { path = "packages/ui" }
vault = { path = "packages/vault" }
index = { path = "packages/index" }
app = { path = "packages/app" }
