name: CI

on:
  push:
    branches: [main, testing]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust: units + component/vault tests ──────────────────────────────────────
  # Scoped to the three crates that actually hold tests. The desktop/mobile shells
  # have no tests and would drag in libxdo/webkit link deps, so they are excluded;
  # the web build is exercised by the e2e job instead.
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Test (vault, ui, app)
        run: cargo test --locked -p vault -p ui -p app

      # Clippy gates on errors; pre-existing warnings are not denied here.
      - name: Clippy (vault, ui, app)
        run: cargo clippy -p vault -p ui -p app

  # ── End-to-end: Playwright drives the real web build ─────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (+ wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key from the rust-tests job (different target set).
          key: e2e

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI (dx)
        # Match the workspace's dioxus alpha. Prebuilt if available, else source.
        run: cargo binstall dioxus-cli@0.8.0-alpha.0 --no-confirm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install npm deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium (+ OS deps)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        # Playwright starts `dx run --package web` itself (see playwright.config.js).
        # CI=1 disables reuseExistingServer and enables retries.
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
